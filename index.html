<body><div id="app"><main id="boot-status" role="status"><small>一里小屋 · HITORI ROOM</small><h1>正在推开小屋的门…</h1><p id="boot-message">正在载入这一页，稍等一下。</p><button id="boot-retry" type="button" hidden>重新载入网站</button></main></div>
<script>
(function(){
 function failed(){var panel=document.getElementById('boot-status');if(!panel)return;panel.dataset.state='error';document.getElementById('boot-message').textContent='这一页暂时没有载入。请检查网络后重试；网站更新后，也可以重新载入。作品、草稿和收藏会保留。';document.getElementById('boot-retry').hidden=false;}
 document.getElementById('boot-retry').addEventListener('click',function(){location.reload()});
 window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'||e.error)failed();},true);
 window.addEventListener('unhandledrejection',failed);
 window.addEventListener('vite:preloadError',function(e){if(document.getElementById('boot-status')){e.preventDefault();failed();}});
 setTimeout(function(){var label=document.getElementById('boot-message');if(label){label.textContent='载入比平时久一点。请检查网络，也可以重新载入；你的作品和草稿会保留。';document.getElementById('boot-retry').hidden=false;}},15000);
})();
</script><script type="module" src="/src/main.js"></script><noscript>一里小屋需要 JavaScript 才能开启角色切换、音乐与相册互动。</noscript></body>
