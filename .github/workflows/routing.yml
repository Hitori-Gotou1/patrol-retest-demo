name: Route regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect current public Pages bundle (read only)
        continue-on-error: true
        run: python scripts/inspect-pages.py https://hitori-gotou1.github.io/patrol-retest-demo/
      - run: npm ci
      - run: npm test
      - name: Prepare offline QA dependencies
        run: tar -czf /tmp/routing-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: routing-dependencies
          path: /tmp/routing-dependencies.tar.gz
          retention-days: 1
