name: Gallery import and preview checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r tests/requirements-gallery.txt -r tests/requirements-browser.txt
      - run: npm run test:gallery-import
      - run: npm run gallery:check
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
      - run: npm run test:lightbox
